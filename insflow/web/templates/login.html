<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 | Insight Flow 情报台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:oklch(96.5% .016 85);--surface:oklch(100% 0 0/.72);--fg:oklch(22% .02 70);--muted:oklch(46% .016 70);
--border:oklch(86% .014 80);--accent:oklch(52% .17 258);--accent-soft:oklch(52% .17 258/.12);--on-accent:oklch(100% 0 0);
--danger:oklch(55% .2 25);--danger-soft:oklch(55% .2 25/.12);--r-lg:26px;--r-sm:12px;
--font:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC",system-ui,sans-serif}
body{font-family:var(--font);color:var(--fg);background:var(--bg);min-height:100vh;display:grid;place-items:center;
background-image:radial-gradient(1200px 600px at 20% -10%,oklch(52% .17 258/.10),transparent),radial-gradient(900px 500px at 90% 10%,oklch(58% .16 285/.10),transparent)}
.card{width:min(400px,92vw);background:var(--surface);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--border);
border-radius:var(--r-lg);padding:32px;box-shadow:0 24px 60px -24px oklch(30% .04 80/.35)}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
.brand small{font-weight:500;font-size:12px;color:var(--muted);margin-left:8px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input{width:100%;height:42px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--border);background:oklch(100% 0 0/.9);font-size:14px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{width:100%;height:44px;margin-top:22px;border:0;border-radius:var(--r-sm);background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.05)}
.err{margin-top:16px;padding:10px 14px;border-radius:var(--r-sm);background:var(--danger-soft);color:var(--danger);font-size:13px}
.foot{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Insight Flow<small>情报台</small></div>
  <div class="sub">全域数据监测与洞察 · 登录后进入你的情报台</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/console/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>邮箱</label>
    <input name="email" type="email" required autofocus placeholder="you@example.com">
    <label>密码</label>
    <input name="password" type="password" required placeholder="至少 8 位">
    <button type="submit">登录</button>
  </form>
  {% if sso_enabled %}
  <p style="margin-top:14px;font-size:12.5px;color:var(--muted)">
    或使用企业账号登录
  </p>
  <div class="toolbar">
    <a class="dp-btn" href="/console/sso/login?next=/console">SSO 单点登录（OIDC）</a>
  </div>
  {% endif %}
  <div class="foot">还没有账号？<a href="/console/register">立即注册</a>{% if not saas %} · <span style="opacity:.7">（SaaS 模式未开启，可匿名使用）</span>{% endif %}</div>
</div>
</body>
</html>
